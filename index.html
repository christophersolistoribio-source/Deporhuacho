<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeporHuacho - Registro de Canchas</title>
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        h1 {
            text-align: center;
            color: var(--primary-dark);
            margin-bottom: 25px;
            font-size: 1.75rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-dark);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>DeporHuacho - Registro</h1>
        <form id="registroForm">
            <div class="form-group">
                <label for="nombrePropietario">Nombre del Propietario o Encargado</label>
                <input type="text" id="nombrePropietario" placeholder="Ej. Juan Pérez" required>
            </div>

            <div class="form-group">
                <label for="telefono">Número de WhatsApp</label>
                <input type="text" id="telefono" placeholder="Ej. 987654321" required>
            </div>

            <div class="form-group">
                <label for="zona">Zona / Sector en Huacho</label>
                <input type="text" id="zona" placeholder="Ej. Centenario, Amay, Rosa Luz..." required>
            </div>

            <button type="submit" class="btn">Guardar Información</button>
        </form>
    </div>

</body>
</html>
